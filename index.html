<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f0f9ff">
  <title>وەرگێڕی ژیر</title>
  <style>
    :root {
      --bg-color: #f0f9ff;
      --text-color: #0f2b46;
      --card-bg: #ffffff;
      --border-color: #b8d2e3;
      --primary: #1874a5;
      --primary-hover: #125a82;
      --tab-bg: #e0f2fe;
    }
    [data-theme="dark"] {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --card-bg: #1e293b;
      --border-color: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --tab-bg: #334155;
    }
    * { box-sizing: border-box; font-family: Arial, sans-serif; transition: background-color 0.3s, color 0.3s; }
    body { margin: 0; background: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    
    .app-container {
      background: var(--bg-color);
      width: 100%;
      max-width: 450px;
      min-height: 850px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      position: relative;
      overflow: hidden;
      border: 6px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
    }
    [data-theme="dark"] .app-container { border-color: #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
    header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 8px; color: var(--text-color); }
    .theme-toggle { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-color); }

    .tabs { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 30px; }
    .tab-btn { flex: 1; padding: 12px 5px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .tab-content { display: none; flex-direction: column; flex: 1; }
    .tab-content.active { display: flex; }

    .box { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 15px; padding: 15px; text-align: center; position: relative; margin-bottom: 15px; }
    .box textarea { width: 100%; min-height: 120px; border: none; background: transparent; color: var(--text-color); font-size: 18px; text-align: center; resize: none; outline: none; }
    .box-label { font-size: 14px; font-weight: bold; color: var(--text-color); margin-top: 10px; }
    
    .arrow-down { text-align: center; font-size: 24px; color: var(--primary); margin: -5px 0 10px 0; }

    .box.dark-box { background: var(--primary); border-color: var(--primary); color: white; }
    .box.dark-box textarea { color: white; }
    .box.dark-box .box-label { color: white; }

    .action-btn { background: var(--primary); color: white; border: none; border-radius: 20px; padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: auto; display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%; box-shadow: 0 4px 15px rgba(24, 116, 165, 0.3); }
    .action-btn:disabled { opacity: 0.6; cursor: wait; }

    /* بەشی وێنە */
    .upload-area { border: 2px dashed var(--primary); border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; background: var(--card-bg); margin-bottom: 20px; }
    .upload-icon { font-size: 40px; color: var(--primary); margin-bottom: 10px; }
    .upload-text { color: var(--text-color); font-weight: bold; font-size: 16px; }
    #imageFile { display: none; }
    .canvas-container { width: 100%; overflow-x: auto; margin-bottom: 15px; display: none; border: 2px solid var(--border-color); border-radius: 12px; }
    canvas { max-width: 100%; height: auto; display: block; }
    
    /* نەخشی باکگراوند */
    .waves { position: absolute; bottom: 100px; left: 10px; opacity: 0.3; }
    .waves2 { position: absolute; top: 300px; right: 10px; opacity: 0.3; }
    
    #statusMsg { text-align: center; font-size: 13px; margin-top: 10px; color: var(--text-color); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌓</button>
      <h1>وەرگێڕی ژیر <span>🌀</span></h1>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('text')">نووسین ✏️</button>
      <button class="tab-btn" onclick="switchTab('file')">فایل 📄</button>
      <button class="tab-btn" onclick="switchTab('image')">وێنە 📷</button>
    </nav>

    <!-- بەشی نووسین -->
    <main id="tab-text" class="tab-content active">
      <div class="box">
        <textarea id="sourceText" placeholder="Write english text here"></textarea>
      </div>
      <div class="box-label" style="text-align: center; margin-top:-5px; margin-bottom:5px;">دەقی ئینگلیزی</div>
      
      <div class="arrow-down">↓</div>

      <div class="box dark-box">
        <textarea id="resultText" placeholder="دەقی کوردی لێرە دەردەکەوێت" readonly></textarea>
      </div>
      <div class="box-label" style="text-align: center; margin-top:-5px;">دەقی کوردی</div>

      <div style="flex-grow: 1;"></div>
      <button class="action-btn" onclick="translateText()">وەرگێڕان بۆ کوردی 🔄</button>
    </main>

    <!-- بەشی فایل -->
    <main id="tab-file" class="tab-content">
      <div class="box" style="padding: 25px 15px;">
        <span style="font-size:18px; font-weight:bold;">📄 Englishbook.pdf</span>
      </div>
      <div class="box-label" style="text-align: center; margin-top:-5px; margin-bottom:5px;">ئەو فایلەی دیاری کراوە</div>
      
      <div class="arrow-down">↓</div>

      <div class="box" style="background: #d1fae5; border-color: #34d399; padding: 25px 15px;">
        <span style="font-size:18px; font-weight:bold; color: #065f46;">📄 Englishbook_Kurdish.pdf</span>
      </div>
      <div class="box-label" style="text-align: center; margin-top:-5px;">ئەو فایلەی وەرگێڕدراو بۆ زمانی کوردی</div>

      <div style="flex-grow: 1;"></div>
      <button class="action-btn" onclick="alert('بەشی فایل لە داهاتوودا بەردەست دەبێت')">داگرتنی فایلی وەرگێڕدراو 📥</button>
    </main>

    <!-- بەشی وێنە -->
    <main id="tab-image" class="tab-content">
      <label for="imageFile">
        <div class="upload-area">
          <div class="upload-icon">↑</div>
          <div class="upload-text">وێنەکە لێرە دابنێ یان کامێرا بکەرەوە</div>
        </div>
      </label>
      <input id="imageFile" type="file" accept="image/jpeg, image/png, image/webp">
      
      <div class="canvas-container" id="canvasContainer">
        <canvas id="imageCanvas"></canvas>
      </div>
      
      <p id="statusMsg"></p>

      <div style="flex-grow: 1;"></div>
      <button class="action-btn" id="translateImageBtn" onclick="processImage()">وێنەی وەرگێڕدراو بۆ کوردی 🖼️</button>
      <button class="action-btn" id="downloadImageBtn" style="display:none; background:#10b981; margin-top:10px;" onclick="downloadTranslatedImage()">داگرتنی وێنەکە 📥</button>
    </main>

  </div>

  <script>
    // تکایە لێرەدا لینکە ڕاستەقینەکەی Worker ـەکەت دابنێ
    const WORKER_URL = "YOUR_WORKER_URL_HERE"; // بیخە شوێنی ئەمە
    
    // دۆخی تاریک و ڕوون
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      if(current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }

    // گۆڕینی تابلۆکان (Tabs)
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.currentTarget.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    // لۆجیکی پێشووی وێنەکە
    let originalImageObj = null;

    function translateText() {
      document.getElementById("resultText").value = "ئەم بەشە هێشتا بە Gemini نەبەستراوەتەوە.";
    }

    document.getElementById("imageFile").addEventListener("change", event => {
      const file = event.target.files[0];
      if (file) {
        document.getElementById("statusMsg").textContent = "وێنە هەڵبژێردرا: " + file.name;
        document.getElementById("canvasContainer").style.display = "none";
        document.getElementById("downloadImageBtn").style.display = "none";
        document.getElementById("translateImageBtn").style.display = "flex";
        
        const reader = new FileReader();
        reader.onload = function(e) {
          originalImageObj = new Image();
          originalImageObj.onload = function() {
            const canvas = document.getElementById('imageCanvas');
            canvas.width = originalImageObj.width;
            canvas.height = originalImageObj.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImageObj, 0, 0);
            document.getElementById("canvasContainer").style.display = "block";
          }
          originalImageObj.src = e.target.result;
        }
        reader.readAsDataURL(file);
      }
    });

    async function processImage() {
      if (!originalImageObj) {
        document.getElementById("statusMsg").textContent = "تکایە سەرەتا وێنەیەک هەڵبژێرە";
        return;
      }

      const btn = document.getElementById("translateImageBtn");
      const status = document.getElementById("statusMsg");
      btn.disabled = true;
      status.innerHTML = "خەریکی وەرگێڕان... تکایە چاوەڕێ بە.";

      try {
        const canvas = document.getElementById('imageCanvas');
        const base64Image = canvas.toDataURL("image/jpeg").split(',')[1];

        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image, mimeType: 'image/jpeg' })
        });

        if (!response.ok) throw new Error("کێشەیەک لە پەیوەندی سێرڤەر ڕوویدا");
        const data = await response.json();
        if (data.error) throw new Error(data.error);

        let transArray = data.translations;
        if (!Array.isArray(transArray)) {
           if (transArray && transArray.translations) transArray = transArray.translations;
           else throw new Error("فۆرماتی داتا هەڵەیە");
        }

        status.innerHTML = "وەرگێڕان بە سەرکەوتوویی تەواو بوو!";
        drawTranslationsOnCanvas(transArray);
        
        btn.style.display = "none";
        document.getElementById("downloadImageBtn").style.display = "flex";

      } catch (error) {
        status.textContent = "کێشەیەک ڕوویدا: " + error.message;
        btn.disabled = false;
      }
    }

    function drawTranslationsOnCanvas(translations) {
      const canvas = document.getElementById('imageCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      ctx.drawImage(originalImageObj, 0, 0);

      translations.forEach(item => {
        if(!item.box_2d || item.box_2d.length !== 4) return;
        const [ymin, xmin, ymax, xmax] = item.box_2d;
        const x = (xmin / 1000) * width;
        const y = (ymin / 1000) * height;
        const boxWidth = ((xmax - xmin) / 1000) * width;
        const boxHeight = ((ymax - ymin) / 1000) * height;

        ctx.fillStyle = 'rgba(24, 116, 165, 0.85)'; // شینی دیزاینەکە
        ctx.fillRect(x, y, boxWidth, boxHeight);

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.direction = 'rtl';
        
        let fontSize = Math.min(boxHeight * 0.7, boxWidth * 0.15); 
        ctx.font = `bold ${fontSize}px Arial, sans-serif`;
        
        const textX = x + (boxWidth / 2); 
        const textY = y + (boxHeight / 2);
        
        ctx.fillText(item.kurdish_translation || "", textX, textY);
      });
    }

    function downloadTranslatedImage() {
      const canvas = document.getElementById('imageCanvas');
      const link = document.createElement('a');
      link.download = 'translated-image.png';
      link.href = canvas.toDataURL("image/png");
      link.click();
    }
  </script>
</body>
</html>
